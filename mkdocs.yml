site_name: Citsy-32blit Documentation
site_description: Documentation for Citsy Bitsy Engine running on Waveshare RP2350 Plus & 32blit SDK
site_author: TeriyakiGod
site_url: https://TeriyakiGod.github.io/citsy-32blit/docs/
repo_url: https://github.com/TeriyakiGod/citsy-32blit
repo_name: TeriyakiGod/citsy-32blit
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

nav:
  - Overview: index.md
  - Hardware & Pico SDK Integration: hardware-integration.md
  - System Architecture & Citsy Integration: citsy-32blit-architecture.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
